<!DOCTYPE html>
<html lang="en">
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="style_explorar.css">
    <script src="script.js" defer></script>
    <script src="api.js" defer></script>
    <title>Paletta - Explorar</title>
</head>
<body onload="carregarDados();">
    <!-- Parte do Cabeçalho -->
     <header class="cont-cabecalho">
        <a href="index.html">
        <h1 class="item-cabecalho logo-cabecalho">Paletta</h1></a>
        <button class="item-cabecalho login-cabecalho botaocomop" id="abrirmodal">Login</button>
        <p class="item-cabecalho register-cabecalho"><a href="register.html">Register</a></p>
     </header>
     <section id="localdepost" class="container-posts">
        <section class="post-thumb" onclick="abrirpost();">Nome Post</section>
     </section>
    

    <dialog id="modalPost" class="modal-de-post">
    
    <section>
        <h1 id="titulo">N/A</h2>
        <button id="fecharbtnpost" class="fecharbtn" onclick="fecharpost();">X</button>
    </section>

    <section class="campos">
        <section class="campo-descricao">
            <h2>Descrição:</h2>
            <p id="descricao">Descrição: </p>
        </section>  

        <section class="campo-especificacao">
            <p id="tamanho">Tamanho: </p>
        </section>

        <section>
            <h2>Informações de Contato:</h2>
            <p id="comuniOutros">Contato: </p>
        </section>

        <section>
            <button onclick="editar();">Atualizar</button>
            <button onclick="excluir();">Deletar</button>
        </section>

    </section>
    </dialog>


     <section class="icone-novo-post">
        <a class="botao-novo-post" href="criacaopost.html">+</a>
     </section>
</body>
</html>
