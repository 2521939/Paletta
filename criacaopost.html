<!DOCTYPE html>
<html lang="en">
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style_criarpost.css">
    <script src="script.js" defer></script>
   <script src="api.js" defer></script>
    <title>Paletta - Criação de Post</title>
</head>
<body>
    <!-- Parte do Cabeçalho -->
     <header class="cont-cabecalho">
        <a href="index.html">
        <h1 class="item-cabecalho logo-cabecalho">Paletta</h1></a>
        <button class="item-cabecalho login-cabecalho botaocomop" id="abrirmodal">Login</button>
        <p class="item-cabecalho register-cabecalho"><a href="register.html">Register</a></p>
     </header>
     <section class="container-criacao">
      <section class="criacao-dentro">
         <section class="header-criar">
         <a class="voltar" href="explorar.html">&lt</a> 
        <h1 class="titulo-criar">Crie seu post!</h1>
      </section>

        <h2 class="titulos-campos">Titulo do seu Post:</h2>
        <label for="titulo">Titulo: </label>
        <input class="circularinput" type="text" id="titulo" name="titulo" placeholder="Escreva sobre o que se trata">

        <h2 class="titulos-campos">Descrição:</h2>
        <section>
        <label required minlength="20" maxlenght="250" for="descricao">Descrição: </label>
        <input class="circularinput" type="text" id="descricao" name="descricao" placeholder="De uma descrição para seu post!">
        </section>

        <h2 class="titulos-campos">Especificações:</h2>

        <section>
        <label for="resolucao">Tamanho: </label>
        <select name="resolucao" id="resolucao">
        <option value="3840x2160">Computador/Monitor (3840 x 2160)</option>
        <option value="2560x1440">Computador/Monitor (2560 x 1440)</option>
        <option value="1920x1080">Computador/Monitor (1920 x 1080)</option>
        <option value="1366x720">Computador/Monitor (1366 x 720)</option>
        <option value="1440x3200">SmartPhone (1440 x 3200)</option>
        <option value="1170x2532">SmartPhone (1170 x 2532)</option>
        <option value="1080x2400">SmartPhone (1080 x 2400)</option>
        <option value="720x1600">SmartPhone (720 x 1600)</option>
        <option value="resOutro">Outro (Detalhar na Descrição)</option>
        </select>
        </section>

        <section>
        <label for="imagempos">Imagem de referencia: </label>
        <input type="file" id="imagempos" name="imagempos" placeholder="Insira sua imagem">
        </section>

        <h2 class="titulos-campos">Informações de Contato:</h2>

        <section>
        <label for="comuniOutros">Meio de Comunicação: </label>
        <input class="circularinput" type="text" id="comuniOutros" name="comuniOutros" placeholder="Insira seu meio de comunicação">
        </section>

        <label for="idPos">Id para testes</label>
        <input class="circularinput" type="text" name="idPos" id="idPos">
        <button class="button-criar" id="criarpostbtn" onclick="gravar();">Criar Post</button>
        </section>
     </section>
</body>
</html>
